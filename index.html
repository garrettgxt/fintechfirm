<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Coinstate Capital</title>

    <!-- Open Graph — produces rich link embeds on Discord, Slack, iMessage,
         Facebook, LinkedIn, etc. Instagram deliberately does NOT unfurl link
         previews anywhere in its own app (DMs, bio links, Stories) — that's
         a platform restriction on their end, not something fixable here. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Coinstate Capital" />
    <meta property="og:title" content="Coinstate Capital — One balance. Your coins and your stocks." />
    <meta property="og:description" content="A secure, self-custodial wallet is created for you the moment you log in. Fund it through licensed on-ramps, and invest across crypto and stocks from one view." />
    <meta property="og:url" content="https://coinstatecapital.com/" />
    <meta property="og:image" content="https://coinstatecapital.com/og-image.png" />
    <meta property="og:image:width" content="1567" />
    <meta property="og:image:height" content="511" />

    <!-- Twitter Card — some unfurlers (and X/Twitter itself) read this
         instead of/alongside Open Graph. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Coinstate Capital — One balance. Your coins and your stocks." />
    <meta name="twitter:description" content="A secure, self-custodial wallet is created for you the moment you log in. Fund it through licensed on-ramps, and invest across crypto and stocks from one view." />
    <meta name="twitter:image" content="https://coinstatecapital.com/og-image.png" />

    <!-- Discord uses this as the embed's left accent bar color. -->
    <meta name="theme-color" content="#B08A4E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
